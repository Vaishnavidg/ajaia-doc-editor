# Fly.io deployment config.
# Usage:
#   fly launch --no-deploy       # create the app (accept this fly.toml)
#   fly volumes create data --size 1 --region <region>
#   fly deploy
app = "ajaia-doc-editor"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/prod.db"
  SEED_ON_START = "true"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# SQLite + a single mounted volume means exactly one machine may run.
[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
